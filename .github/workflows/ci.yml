# CI (cicd-pipeline.md stages 1-7)
# Runs on pushes to develop and main, and on pull requests to either.
# Builds the zip and keeps it for 30 days only when stages 1-6 all pass. Never submits to the store automatically.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, build, test, manifest, zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Stage 1: setup
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stage 2: static checks (ESLint and Prettier)
      - name: Lint
        run: npm run lint

      # Stage 3: build (.output/chrome-mv3/ and the Vite chunk lists)
      - name: Build
        run: npm run build

      # Before stage 4: make sure the test HTML/JSON fixtures contain no org data (U2)
      - name: Check fixtures
        run: npm run check:fixtures

      # Stage 4: tests (fails below 80% line coverage)
      - name: Test with coverage
        run: npm run test -- --coverage

      # Stages 5-6: manifest, published files, external URLs, React in the entry
      - name: Check manifest
        run: npm run check:manifest

      # Stage 7: build the zip and keep it as a 30-day artifact
      - name: Zip
        run: npx wxt zip

      - name: Upload extension zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sf-toybox-chrome-${{ github.sha }}
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 30
